# Occurrences tools/cloud/literals.py must not count. Every entry needs a reason a reviewer can
# check; the audit prints how many occurrences each entry excuses. Prefer a trailing
# `// cloud-literal: <reason>` comment for a single line.
#
# files:    the whole file is exempt (path relative to the repo root)
# patterns: a Python regex matched against the full source line of the occurrence

files: []

patterns:
  - regex: 'kubernetes\.azure\.com[/"]'
    reason: the AKS node label prefix (kubernetes.azure.com/agentpool, /mode, /accelerator...) is a
      Kubernetes label domain AKS uses in every Azure cloud, not a host
  - regex: '"(disk|file)\.csi\.azure\.com"'
    reason: the Azure Disk and Azure Files CSI driver names are the same in every Azure cloud, not hosts
